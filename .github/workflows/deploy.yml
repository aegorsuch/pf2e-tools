name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild refreshes the bundled Archives of Nethys snapshot
  schedule:
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: github-pages
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            count=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false)] | length")
            if [ "$count" -eq 1 ]; then
              echo "Pages artifact visible."
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::Multiple artifacts named $ARTIFACT_NAME."
              exit 1
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::Pages artifact $ARTIFACT_NAME was not visible within 60 seconds."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
